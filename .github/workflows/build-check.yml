name: Build check (sin deploy)

on:
  push:
    branches-ignore: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Pruebas del asistente Zorro ARVI
        run: node scripts/bot-tests.cjs
      - name: Build site
        run: npm run build
      - name: Upload dist (vista previa descargable)
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
