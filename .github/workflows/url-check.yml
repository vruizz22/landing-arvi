name: URL check (temporal)
on:
  push:
    branches: [tmp-url-check]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://arvi.cl/ https://arvi.cl/catalogo https://arvi.cl/happy https://arvi.cl/happy/ https://arvi.cl/happy/assets/logo.webp https://www.arvi.cl/happy/; do
            echo "$u -> $(curl -s -o /tmp/b -w '%{http_code} %{redirect_url} %{size_download}' -L --max-redirs 0 "$u") $(grep -o '<title>[^<]*' /tmp/b | head -1)"
          done
